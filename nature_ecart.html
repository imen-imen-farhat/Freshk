<h1 style="color:green">Nature de l’écart</h1>
<table id="t" border="1" style="border-collapse:collapse">
<tr><th>Produit<th>Offre<th>Demande<th>Écart<th>Nature<th>Explication</tr>
</table>

<script>
for (let [n, o, d] of [["Tomates", 200, 270], ["Pommes de terre", 1000, 100], ["Oranges", 400, 400]]) {
  let e = o - d, nat = e < 0 ? "Déficit" : e > 0 ? "Surplus" : "Équilibre";
  let c = e < 0 ? "#fdd" : e > 0 ? "#fe9" : "#cfc";
  let p = e < 0 ? "Demande > Stock" : e > 0 ? "Stock > Demande" : "Stock = Demande";
  t.innerHTML += `<tr><td>${n}<td>${o}<td>${d}<td>${e}<td style="background:${c}"><b>${nat}</b><td>${p}`;
}
</script>
