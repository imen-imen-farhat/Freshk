<meta charset="UTF-8"><title>FT-21 Nature de l’écart</title>
<body style="text-align:center;font-family:Arial">
<h1 style="color:green">Nature de l’écart offre/demande</h1>
<table id="tableau" border="1" cellpadding="10" style="margin:auto;border-collapse:collapse">
<tr style="background:green;color:white"><th>Produit<th>Offre<th>Demande<th>Écart<th>Nature<th>Explication</tr></table>
<script>
// Chaque produit : nom, offre (stock), demande (commandes)
const produits = [["Tomates", 200, 270], ["Pommes de terre", 1000, 100], ["Oranges", 400, 400]];
for (const [nom, offre, demande] of produits) {
  const ecart = offre - demande;  // écart = offre - demande
  let nature, phrase, couleur;
  if (ecart < 0) { nature = "Déficit"; phrase = "Les clients veulent plus que le stock disponible."; couleur = "#fdd"; }
  else if (ecart > 0) { nature = "Surplus"; phrase = "Il y a plus de stock que ce que les clients demandent."; couleur = "#fe9"; }
  else { nature = "Équilibre"; phrase = "Le stock correspond exactement à la demande."; couleur = "#cfc"; }
  tableau.innerHTML += `<tr><td>${nom}<td>${offre}<td>${demande}<td>${ecart}<td style="background:${couleur}"><b>${nature}</b><td>${phrase}`;
}
</script>
