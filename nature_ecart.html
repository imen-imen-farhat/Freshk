<meta charset="UTF-8"><title>FT-21 Nature de l’écart</title>
<body style="text-align:center;font-family:Arial">
<h1 style="color:green">Nature de l’écart offre/demande</h1>
<table id="t" border="1" cellpadding="10" style="margin:auto;border-collapse:collapse">
<tr style="background:green;color:white"><th>Produit<th>Offre<th>Demande<th>Écart<th>Nature</tr></table>
<script>
for (const [nom, o, d] of [["Tomates", 200, 270], ["Pommes de terre", 1000, 100], ["Oranges", 400, 400]]) {
  const e = o - d, [nature, couleur] = e < 0 ? ["Déficit", "#fdd"] : e > 0 ? ["Surplus", "#fe9"] : ["Équilibre", "#cfc"];
  t.innerHTML += `<tr><td>${nom}<td>${o}<td>${d}<td>${e}<td style="background:${couleur}"><b>${nature}</b>`;
}</script>
