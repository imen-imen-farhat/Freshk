<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freshk | Offre et demande</title>
<style>
  body{font-family:Arial,sans-serif;background:#f3f7f4;color:#14231c;margin:0;padding:30px}
  h1{color:#0f6b48;margin:0 0 6px}
  .maj{color:#4a5a52;font-size:14px;margin:0 0 20px}
  .outils{margin-bottom:16px}
  input,select{padding:9px;border:2px solid #9fb2a7;border-radius:6px;font-size:14px;background:#fff}
  button{padding:9px 14px;border:0;border-radius:6px;background:#0f6b48;color:#fff;font-weight:bold;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:#fff;margin-bottom:16px}
  th,td{border:2px solid #c9d6ce;padding:12px;text-align:left}
  th{background:#0f6b48;color:#fff}
  .deficit{color:#b00020;font-weight:bold}
  .surstock{color:#8a4b00;font-weight:bold}
  .equilibre{color:#0f6b48;font-weight:bold}
  .fond{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;padding:15px}
  .fenetre{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:520px}
  .fenetre h2{margin:0 0 12px;color:#0f6b48}
  .fenetre p{margin:6px 0}
  .fenetre ul{padding-left:20px;line-height:1.7}
  .fenetre table{margin:10px 0}
  .fenetre th,.fenetre td{padding:8px}
  .fenetre input{width:100%;margin:4px 0}
  .fenetre .fNom{width:55%}
  .fenetre .fQte{width:40%}
  .secondaire{background:#dff0e6;color:#0f6b48}
</style>
</head>
<body>

<h1>Freshk</h1>
<p class="maj">Actualisation automatique activée</p>

<div class="outils">
  <input id="recherche" placeholder="Rechercher un produit..." oninput="afficher()">
  <select id="filtre" onchange="afficher()">
    <option value="tous">Toutes les alertes</option>
    <option value="deficit">Alerte déficit</option>
    <option value="surstock">Alerte surstock</option>
    <option value="equilibre">Aucune alerte</option>
  </select>
</div>

<table>
  <thead>
    <tr>
      <th>Produit</th>
      <th>Quantité offerte</th>
      <th>Quantité demandée</th>
      <th>Écart</th>
      <th>Alerte</th>
      <th>Recommandation</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="tableau"></tbody>
</table>

<button onclick="ajouter()">Ajouter un produit</button>

<!-- Fenêtre de détail -->
<div id="fond" class="fond">
  <div id="fenetre" class="fenetre">
    <h2 id="detailTitre"></h2>
    <div id="detailContenu"></div>
    <p><button onclick="fermer()">Fermer</button></p>
  </div>
</div>

<!-- Fenêtre d'ajout d'un produit -->
<div id="fondAjout" class="fond">
  <div class="fenetre">
    <h2>Ajouter un produit</h2>
    <input id="nomProduit" placeholder="Nom du produit">
    <input id="demandeProduit" type="number" min="0" placeholder="Quantité demandée (kg)">
    <p><b>Fournisseurs</b></p>
    <div id="listeFournisseurs"></div>
    <p><button class="secondaire" onclick="ajouterLigne()">+ Ajouter un fournisseur</button></p>
    <p><button onclick="enregistrer()">Enregistrer</button> <button class="secondaire" onclick="fermerAjout()">Annuler</button></p>
  </div>
</div>

<script>
var produits = [
  {nom: "Tomates", demande: 700, fournisseurs: [{nom: "Fournisseur A", quantite: 300}, {nom: "Fournisseur B", quantite: 200}]},
  {nom: "Pommes de terre", demande: 600, fournisseurs: [{nom: "Fournisseur C", quantite: 500}, {nom: "Fournisseur D", quantite: 400}]},
  {nom: "Carottes", demande: 400, fournisseurs: [{nom: "Fournisseur A", quantite: 250}, {nom: "Fournisseur B", quantite: 150}]},
  {nom: "Oranges", demande: 500, fournisseurs: [{nom: "Fournisseur C", quantite: 200}, {nom: "Fournisseur D", quantite: 100}]},
  {nom: "Poivrons", demande: 500, fournisseurs: [{nom: "Fournisseur A", quantite: 450}, {nom: "Fournisseur B", quantite: 300}]}
];

// L'offre totale d'un produit = somme des quantités de ses fournisseurs
function calculerOffres() {
  produits.forEach(function (p) {
    p.offre = p.fournisseurs.reduce(function (somme, f) { return somme + f.quantite; }, 0);
  });
}

// Récupère les données enregistrées dans le navigateur
function charger() {
  try {
    var sauvegarde = JSON.parse(localStorage.getItem("freshkProduitsV2"));
    if (sauvegarde) produits = sauvegarde;
  } catch (e) {}
  calculerOffres();
}

// Enregistre les données dans le navigateur
function sauvegarder() {
  try { localStorage.setItem("freshkProduitsV2", JSON.stringify(produits)); } catch (e) {}
}

// Analyse d'un produit : alerte, recommandation courte et propositions détaillées
function analyser(p) {
  var ecart = p.offre - p.demande;
  if (ecart < 0) {
    var manque = Math.abs(ecart);
    return {
      ecart: ecart, classe: "deficit", alerte: "Alerte déficit",
      reco: "Renforcer l'approvisionnement de " + manque + " kg.",
      propositions: [
        "Contacter les fournisseurs habituels pour obtenir " + manque + " kg supplémentaires.",
        "Identifier un fournisseur alternatif afin de sécuriser l'approvisionnement.",
        "Négocier des livraisons plus fréquentes pour couvrir la demande."
      ]
    };
  }
  if (ecart > 0) {
    return {
      ecart: ecart, classe: "surstock", alerte: "Alerte surstock",
      reco: "Ajuster les commandes à la baisse de " + ecart + " kg.",
      propositions: [
        "Réduire les prochaines commandes de " + ecart + " kg.",
        "Lancer une offre promotionnelle pour écouler l'excédent de " + ecart + " kg.",
        "Suivre l'évolution de la demande afin d'ajuster les futurs achats."
      ]
    };
  }
  return {
    ecart: 0, classe: "equilibre", alerte: "Aucune alerte",
    reco: "Maintenir le niveau d'approvisionnement actuel.",
    propositions: [
      "Maintenir le niveau d'approvisionnement actuel.",
      "Poursuivre le suivi régulier de l'offre et de la demande.",
      "Anticiper les variations saisonnières de la demande."
    ]
  };
}

function afficher() {
  var lignes = "";
  var recherche = document.getElementById("recherche").value.toLowerCase();
  var filtre = document.getElementById("filtre").value;

  produits.forEach(function (p, i) {
    var a = analyser(p);

    // Recherche par nom et filtre par alerte
    if (!p.nom.toLowerCase().includes(recherche)) return;
    if (filtre !== "tous" && filtre !== a.classe) return;

    lignes += "<tr>" +
      "<td>" + p.nom + "</td>" +
      "<td>" + p.offre + " kg</td>" +
      "<td>" + p.demande + " kg</td>" +
      "<td>" + (a.ecart > 0 ? "+" : "") + a.ecart + " kg</td>" +
      "<td class='" + a.classe + "'>" + a.alerte + "</td>" +
      "<td>" + a.reco + "</td>" +
      "<td><button onclick='detail(" + i + ")'>Détail</button></td>" +
      "</tr>";
  });
  document.getElementById("tableau").innerHTML = lignes || "<tr><td colspan='7'>Aucun produit trouvé.</td></tr>";
}

// Affiche le détail d'un produit : quantité offerte par fournisseur et propositions
function detail(i) {
  var p = produits[i], a = analyser(p);
  var lignesFournisseurs = p.fournisseurs.map(function (f) {
    return "<tr><td>" + f.nom + "</td><td>" + f.quantite + " kg</td></tr>";
  }).join("");

  document.getElementById("detailTitre").textContent = "Détail : " + p.nom;
  document.getElementById("detailContenu").innerHTML =
    "<p><b>Quantité demandée :</b> " + p.demande + " kg</p>" +
    "<table><tr><th>Fournisseur</th><th>Quantité offerte</th></tr>" + lignesFournisseurs +
    "<tr><td><b>Total offert</b></td><td><b>" + p.offre + " kg</b></td></tr></table>" +
    "<p><b>Écart :</b> " + (a.ecart > 0 ? "+" : "") + a.ecart + " kg</p>" +
    "<p><b>Alerte :</b> <span class='" + a.classe + "'>" + a.alerte + "</span></p>" +
    "<p><b>Propositions :</b></p><ul>" +
    a.propositions.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>";
  document.getElementById("fond").style.display = "flex";
}

function fermer() { document.getElementById("fond").style.display = "none"; }

// Ouvre la fenêtre d'ajout d'un produit
function ajouter() {
  document.getElementById("nomProduit").value = "";
  document.getElementById("demandeProduit").value = "";
  document.getElementById("listeFournisseurs").innerHTML = "";
  ajouterLigne();
  ajouterLigne();
  document.getElementById("fondAjout").style.display = "flex";
}

function fermerAjout() { document.getElementById("fondAjout").style.display = "none"; }

// Ajoute une ligne fournisseur (nom + quantité) dans la fenêtre
function ajouterLigne() {
  var ligne = document.createElement("div");
  ligne.innerHTML = "<input class='fNom' placeholder='Nom du fournisseur'> <input class='fQte' type='number' min='0' placeholder='Quantité (kg)'>";
  document.getElementById("listeFournisseurs").appendChild(ligne);
}

// Enregistre le nouveau produit avec ses fournisseurs
function enregistrer() {
  var nom = document.getElementById("nomProduit").value.trim();
  var demande = document.getElementById("demandeProduit").value;
  if (nom === "" || demande === "") {
    alert("Remplissez le nom du produit et la quantité demandée.");
    return;
  }
  var fournisseurs = [];
  document.querySelectorAll("#listeFournisseurs div").forEach(function (ligne) {
    var n = ligne.querySelector(".fNom").value.trim();
    var q = ligne.querySelector(".fQte").value;
    if (n !== "" && q !== "") fournisseurs.push({nom: n, quantite: Number(q)});
  });
  if (fournisseurs.length === 0) {
    alert("Ajoutez au moins un fournisseur avec sa quantité.");
    return;
  }
  produits.push({nom: nom, demande: Number(demande), fournisseurs: fournisseurs});
  calculerOffres();
  sauvegarder();
  afficher();
  fermerAjout();
}

// Actualisation automatique
function actualiser() {
  charger();
  afficher();
}
actualiser();
setInterval(actualiser, 30000);
</script>
</body>
</html>
