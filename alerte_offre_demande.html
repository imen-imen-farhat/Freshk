<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord : équilibre du marché – Freshk</title>
<style>
  :root { --bg:#fbfdf9; --ink:#11261a; --muted:#46594d; --green:#0f3d24; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", Arial, sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:40px 24px 64px; }
  h1 { font:700 34px Georgia, serif; color:var(--green); margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:#fff; border:2px solid var(--ink); min-width:1000px; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid #cfd9d2; vertical-align:middle; }
  th { background:var(--green); color:#fff; white-space:nowrap; }
  td.num, th.num { text-align:right; }
  td input { font:inherit; padding:6px 8px; border:2px solid var(--ink); border-radius:6px; width:100px; text-align:right; }
  td input.nom { width:160px; text-align:left; }
  .badge { display:inline-block; padding:6px 12px; border-radius:6px; font-weight:700; font-size:14px; border:2px solid; }
  .ROUGE  { background:#fde8e8; color:#8a1111; border-color:#c01818; }
  .ORANGE { background:#fff1d6; color:#7a4300; border-color:#f08a00; }
  .VERT   { background:#e4f3e8; color:#0f5a2b; border-color:#1f9d55; }
  tr.r-ROUGE td:first-child  { border-left:8px solid #c01818; }
  tr.r-ORANGE td:first-child { border-left:8px solid #f08a00; }
  tr.r-VERT td:first-child   { border-left:8px solid #1f9d55; }
  button { font:inherit; font-weight:700; padding:8px 16px; border-radius:8px; border:2px solid var(--green); background:#fff; color:var(--green); cursor:pointer; }
  button:hover { background:#e6f1e8; }
  button.add { background:var(--green); color:#fff; margin-top:20px; }
  button.add:hover { background:#0a2a18; }
  button.suppr { padding:4px 10px; font-size:14px; }
  :focus-visible { outline:3px solid #c2410c; outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tableau de bord : équilibre du marché</h1>
  <p class="sub">Freshk Market – état de l’offre et de la demande par produit.</p>
  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>Produit</th><th class="num">Offre (kg)</th><th class="num">Demande (kg)</th><th class="num">Écart (kg)</th>
          <th>Situation</th><th>Risque</th><th>Recommandation</th><th></th>
        </tr>
      </thead>
      <tbody id="corps"></tbody>
    </table>
  </div>
  <button id="ajouter" class="add" type="button">Ajouter un produit</button>
</div>

<script>
const produits = [
  { nom: "Tomates", offre: 200, demande: 270 },
  { nom: "Pommes de terre", offre: 1000, demande: 100 },
  { nom: "Oranges", offre: 400, demande: 400 }
];

function analyser(offre, demande) {
  const ecart = offre - demande;
  if (ecart < 0) {
    return { couleur: "ROUGE", texte: "Déséquilibre : demande supérieure à l’offre",
      risque: "Rupture de stock, ventes perdues, clients insatisfaits.",
      reco: "Augmenter le stock (réapprovisionner) et/ou augmenter le prix pour éviter la rupture de stock." };
  }
  if (ecart > 0) {
    return { couleur: "ORANGE", texte: "Déséquilibre : offre supérieure à la demande",
      risque: "Surstock, produits périmés, perte financière.",
      reco: "Baisser le prix ou lancer une promotion, et réduire le prochain approvisionnement pour éviter le surstock." };
  }
  return { couleur: "VERT", texte: "Équilibre : offre égale à la demande",
    risque: "Risque faible.",
    reco: "Maintenir cette situation : bien suivre le stock et la demande chaque jour, et garder les prix actuels." };
}

const corps = document.getElementById("corps");

function ajouterLigne(p) {
  const tr = document.createElement("tr");
  tr.innerHTML =
    '<td><input class="nom" type="text" aria-label="Produit"></td>' +
    '<td class="num"><input type="number" min="0" aria-label="Offre en kg"></td>' +
    '<td class="num"><input type="number" min="0" aria-label="Demande en kg"></td>' +
    '<td class="num ecart"></td>' +
    '<td class="situation"></td>' +
    '<td class="risque"></td>' +
    '<td class="reco"></td>' +
    '<td><button type="button" class="suppr">Supprimer</button></td>';
  const [nom, offre, demande] = tr.querySelectorAll("input");
  nom.value = p.nom; offre.value = p.offre; demande.value = p.demande;

  function maj() {
    const o = parseFloat(offre.value) || 0;
    const d = parseFloat(demande.value) || 0;
    const e = o - d;
    const r = analyser(o, d);
    tr.className = "r-" + r.couleur;
    tr.querySelector(".ecart").textContent = (e > 0 ? "+" : "") + e;
    tr.querySelector(".situation").innerHTML = '<span class="badge ' + r.couleur + '"></span>';
    tr.querySelector(".situation .badge").textContent = r.texte;
    tr.querySelector(".risque").textContent = r.risque;
    tr.querySelector(".reco").textContent = r.reco;
  }

  offre.addEventListener("input", maj);
  demande.addEventListener("input", maj);
  tr.querySelector(".suppr").addEventListener("click", () => tr.remove());
  corps.appendChild(tr);
  maj();
}

document.getElementById("ajouter").addEventListener("click", () => ajouterLigne({ nom: "", offre: 0, demande: 0 }));
produits.forEach(ajouterLigne);
</script>
</body>
</html>
