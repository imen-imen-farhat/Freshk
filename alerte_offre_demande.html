<meta charset="UTF-8"><body style="text-align:center;font-family:Arial">
<h1 style="color:green">Nature de l’écart offre/demande</h1>
<table id=t border=1 cellpadding=10 align=center><tr bgcolor=green style=color:white>
<th>Produit<th>Offre<th>Demande<th>Écart<th>Nature</tr></table><script>
for (const [nom, o, d] of [["Tomates",200,270],["Oranges",400,400],["Pommes",1000,100]]) {
  const e = o - d;
  const nature = e < 0 ? "Déficit" : e > 0 ? "Surplus" : "Équilibre";
  const c = e < 0 ? "#fdd" : e > 0 ? "#fe9" : "#cfc";
  t.innerHTML += `<tr><td>${nom}<td>${o}<td>${d}<td>${e}<td bgcolor="${c}">${nature}`;
}</script>
